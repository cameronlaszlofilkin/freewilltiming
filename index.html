<!DOCTYPE html>
<html>
    <head>
        <title>Free Will Timing Task</title>
        <script src="https://unpkg.com/jspsych@8.3.0"></script>
        <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
        <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@2.2.0"></script>
        <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
        <script src="https://pipe.jspsych.org/api/data"></script>
        <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css" />
    </head>
    <body></body>
    <script>
        var jsPsych = initJsPsych({
            on_finish: function() {
                DataPipe.save({
                    experimentID: "3UkeFinItwMF",
                    filename: jsPsych.randomization.randomID(10) + ".csv",
                    data: jsPsych.data.get().csv()
                });
            }
        });

        var timeline = [];

        var preload = {
            type: jsPsychPreload,
            images: ['img/oist.png']
        };
        timeline.push(preload);

        var welcome = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: "Welcome to the experiment. Press any key to begin."
        };
        timeline.push(welcome);

        var instructions = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <p>In this experiment, you will asked to click at any point during a trial.</p><p>You should click whenever you feel the urge to.</p>
                <p>Some trials will be <strong>longer</strong>, and some will be <strong>shorter</strong>.</p>
                <p> Press <kbd>spacebar</kbd> when you feel like it, and wait until the end of the trial.</p>
                <div style='width: 700px;'>
                <div style='display: block; margin: auto;'><img src='img/oist.png'></img>
                </div>
                <p>Press any key to begin.</p>
            `,
            post_trial_gap: 500
        };
        timeline.push(instructions);

        var trial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div style="font-size: 60px;">+</div>',
            choices: "ALL_KEYS",
            trial_duration: function(){
                return jsPsych.randomization.sampleWithoutReplacement([5000, 10000, 15000, 20000], 1)[0];
            },
            response_ends_trial: false,
            data: {
                task: 'response'
            }
        };

        var procedure = {
            timeline: [trial],
            randomize_order: true,
            repetitions: 4
        };
        timeline.push(procedure);

        var debrief_block = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() {

                var trials = jsPsych.data.get().filter({task: 'response'});
                var rt = Math.round(trials.select('rt').mean());
                var rt_sec = rt / 1000;

                return `<p>Your average response time was ${rt_sec}s.</p>
                    <p>Press any key to complete the experiment. Thank you!</p>`;
            }
        };
        timeline.push(debrief_block);

        jsPsych.run(timeline);
    </script>
</html>
